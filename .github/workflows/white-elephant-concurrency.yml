name: White Elephant concurrency
on:
  pull_request:
    paths:
      - 'backend/white-elephant.sql'
      - 'backend/tests/white-elephant-concurrency.py'
      - 'backend/tests/white-elephant-phones.py'
      - 'victory*'
      - 'awards-demo*'
      - 'backend/white-elephant-awards.sql'
      - 'backend/tests/white-elephant-awards*'
      - 'white-elephant-host.*'
      - 'white-elephant-tv.*'
      - 'white-elephant-photos.js'
      - 'white-elephant-announcements.*'
      - 'backend/white-elephant-tv-announcements.sql'
      - 'supabase/functions/we-gift-photo/**'
      - 'white-elephant.css'
      - '.github/workflows/white-elephant-concurrency.yml'
permissions:
  contents: read
jobs:
  confirm-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 15
      rest:
        image: postgrest/postgrest:v12.2.12
        env:
          PGRST_DB_URI: postgres://postgres@postgres:5432/postgres
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_SCHEMAS: public
          PGRST_JWT_SECRET: disposable-white-elephant-browser-fixture-secret
        ports:
          - 127.0.0.1:3000:3000
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - run: python backend/tests/white-elephant-concurrency.py
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres

      - run: python -m pip install 'playwright>=1.50,<2' && (python -m playwright install --with-deps chromium > /tmp/phone-browser-install.log 2>&1 || { tail -40 /tmp/phone-browser-install.log; exit 1; })
      - name: Verify every award group and capture review frames
        run: python backend/tests/white-elephant-awards-browser.py
      - uses: actions/upload-artifact@v4
        with:
          name: white-elephant-award-screens
          path: review/*.png
      - name: Play a staged game with two hosts and the paired TV
        run: python backend/tests/white-elephant-phones.py
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          TEST_JWT_SECRET: disposable-white-elephant-browser-fixture-secret
      - name: Capture mascot review screens with sample game data
        if: github.head_ref == 'retro-elephant-review'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/wishlist-before "$BASE_SHA"
          python -m pip install scikit-image
          python backend/tests/white-elephant-visual-review.py /tmp/wishlist-before review/before
          python backend/tests/white-elephant-visual-review.py . review/after
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'retro-elephant-review'
        with:
          name: mascot-screen-review
          path: review/

